name: portfolio_app
description: "Arreeya's portfolio. Flutter developer building mobile apps."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
  macos:
    generate: true
  image_path: "assets/images/logo.png"

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
